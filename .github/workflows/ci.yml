name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight — no point paying for a check on
# a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # The single source of truth for the Node version, shared with Render.
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      # mongodb-memory-server downloads a mongod binary on first use, and by default puts it in
      # node_modules/.cache — which `npm ci` deletes, so it would download on every single run.
      # MONGOMS_DOWNLOAD_DIR moves it somewhere stable that can actually be cached.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: mongod-${{ runner.os }}-

      - run: npm ci
      - run: npx tsc --noEmit
      # No .env needed: vitest.config.ts supplies every variable env.ts requires, and the tests run
      # against an in-memory replica set rather than a real database.
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      - run: npm run build

  client:
    name: client (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Every client env var is optional with a local default, so the build needs no secrets. It
      # exercises the real production compile, including the generated OG images and sitemap.
      - run: npm run build

  e2e:
    name: browser (playwright · desktop · tablet · mobile)
    runs-on: ubuntu-latest
    # A standalone mongod is enough here: ENABLE_TRANSACTIONS is off below, so the cascade deletes
    # take their non-transactional path. The API's own suite covers the transactional one against a
    # real replica set.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Start the API
        working-directory: server
        env:
          NODE_ENV: development
          MONGODB_URI: mongodb://127.0.0.1:27017/marginalia_e2e
          JWT_SECRET: e2e-secret-that-is-at-least-32-characters-long
          CLIENT_URL: http://localhost:3000
          LOG_LEVEL: warn
          ENABLE_TRANSACTIONS: "false"
          # A full browser run registers an account per test; the production default of 300 per
          # 15 minutes would 429 midway and look like an application failure.
          RATE_LIMIT_MAX: "100000"
          RATE_LIMIT_WINDOW_MS: "60000"
          # Required by env.ts. Never contacted — no test uploads a file.
          CLOUDINARY_CLOUD_NAME: e2e
          CLOUDINARY_API_KEY: e2e
          CLOUDINARY_API_SECRET: e2e
        run: |
          npm run build
          nohup node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && break || sleep 2
          done

      - name: Build the client
        working-directory: client
        run: npm run build

      - name: Run the browser suite
        working-directory: client
        env:
          CI: "true"
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
